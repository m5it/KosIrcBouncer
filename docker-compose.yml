version: '3.8'

services:
  irc-bnc:
    build: .
    container_name: irc-bnc
    ports:
      - "6667:6667"
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - BNC_DATA_DIR=/data
    restart: unless-stopped
    networks:
      - bnc-network

networks:
  bnc-network:
    driver: bridge